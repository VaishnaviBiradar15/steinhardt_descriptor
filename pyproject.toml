[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steinhardt"
version = "0.1.0"
description = "Steinhardt bond-orientational order parameters Q_l, W_l and W_l_hat"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "numba>=0.58",
    "ase>=3.22",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["steinhardt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
